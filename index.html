<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Katalog</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;}
html{margin:0;padding:0;-webkit-text-size-adjust:100%;}
body{margin:0;padding:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;}
button,input{font-family:Arial,Helvetica,sans-serif;font-size:16px;}
.katalogApp{min-height:100vh;background:#fff;}
#topBar{position:sticky;top:0;z-index:9999;display:flex;align-items:center;gap:7px;padding:max(6px,env(safe-area-inset-top)) 7px 7px 7px;background:#111;color:#fff;}
#topBar button{flex:0 0 auto;min-height:44px;border:0;border-radius:7px;padding:8px 11px;background:#fff;color:#111;font-weight:bold;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
#topBar button:disabled{opacity:.35;cursor:not-allowed;}
#topBar .naslov{flex:1;min-width:0;text-align:center;font-weight:bold;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#topBar .strana{flex:0 0 auto;font-size:13px;white-space:nowrap;}
#snimi{background:#198754!important;color:#fff!important;}
#sadrzaj{width:100%;max-width:1400px;margin:0 auto;padding:25px max(20px,env(safe-area-inset-right)) 25px max(20px,env(safe-area-inset-left));}
.naslovna{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.naslovna img{width:900px;height:900px;max-width:90vw;max-height:65vh;object-fit:contain;}
.naslovna h1{margin-top:20px;font-size:42px;overflow-wrap:anywhere;}
.mreza{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px;}
.proizvod{width:100%;min-width:0;text-align:center;}
.brojNaSlici{display:block;width:70px;height:44px;margin:0 auto 8px auto;padding:5px 8px;border:2px solid #111;border-radius:8px;background:#fff;color:#111;text-align:center;font-size:22px;font-weight:bold;line-height:30px;outline:none;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.brojNaSlici:focus{border-color:#000;box-shadow:0 0 0 3px rgba(0,0,0,.15);}
.slikaBox{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa;border-radius:12px;cursor:pointer;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.slika{width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity .2s ease;}
.slika.poluprovidna{opacity:.5;}
.ime{margin-top:10px;font-size:16px;font-weight:bold;overflow-wrap:anywhere;word-break:break-word;}
#navigacija{display:flex;justify-content:center;gap:12px;padding:20px max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));}
#navigacija button{min-width:120px;min-height:46px;border:0;border-radius:8px;padding:11px 17px;background:#111;color:#fff;font-weight:bold;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
#navigacija button:disabled{opacity:.4;cursor:not-allowed;}
.katalogModalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20000;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:15px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.katalogModalOverlay.prikazi{display:flex;}
.katalogModalBox{width:100%;max-width:460px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:14px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);color:#111;}
.katalogModalBox h2{margin:0 0 18px 0;text-align:center;font-size:22px;}
.katalogModalBox p{margin:8px 0 14px;line-height:1.45;}
.katalogModalBox label{display:block;font-weight:bold;margin:10px 0 5px;}
.katalogModalBox input{width:100%;min-height:46px;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px;-webkit-appearance:none;appearance:none;}
.katalogModalButton{width:100%;min-height:48px;border:0;border-radius:9px;padding:12px;margin-top:9px;font-size:16px;font-weight:bold;cursor:pointer;touch-action:manipulation;}
.katalogModalPrimary{background:#198754;color:#fff;}
.katalogModalSecondary{background:#eee;color:#111;}
.katalogModalClose{background:#d33;color:#fff;}
.katalogEmailInfo{text-align:center;margin-top:15px;font-size:14px;color:#555;}
.katalogEmailInfo a{color:#111;font-weight:bold;word-break:break-word;}
.katalogFormaRed{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:1000px){.mreza{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}}
@media(max-width:800px){#sadrzaj{padding:15px max(15px,env(safe-area-inset-right)) 15px max(15px,env(safe-area-inset-left));}.mreza{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}.naslovna h1{font-size:32px;}.brojNaSlici{width:65px;height:42px;font-size:20px;line-height:26px;}}
@media(max-width:600px){#topBar{gap:4px;padding:max(5px,env(safe-area-inset-top)) 5px 5px 5px;}#topBar button{min-height:44px;padding:7px 8px;font-size:13px;}#topBar .naslov{font-size:13px;}#topBar .strana{display:none;}.mreza{gap:10px;}.ime{font-size:13px;}.brojNaSlici{width:60px;height:40px;font-size:18px;line-height:24px;margin-bottom:6px;}}
@media(max-width:500px){.katalogFormaRed{grid-template-columns:1fr;}.katalogModalBox{padding:16px;}.naslovna img{max-height:55vh;}.naslovna h1{font-size:27px;}#navigacija{gap:8px;}#navigacija button{min-width:0;flex:1;}}
@media(orientation:landscape) and (max-height:600px){.naslovna{min-height:70vh;}.naslovna img{max-height:50vh;}}
</style>
</head>
<body>
<div class="katalogApp">
<div id="topBar">
<button id="prethodnaGore" type="button">←</button>
<div class="naslov" id="naslovKataloga"></div>
<div class="strana" id="brojStrane"></div>
<button id="sledecaGore" type="button">→</button>
<button id="snimi" type="button">⬇️ SNIMI</button>
</div>
<div id="modalOverlay" class="katalogModalOverlay">
<div class="katalogModalBox" id="modalIzbor">
<h2>Snimi narudžbinu</h2>
<p>Izaberite način čuvanja narudžbine.</p>
<button id="izborXlsx" type="button" class="katalogModalButton katalogModalPrimary">Snimi je kao Excel dokument (.xlsx)</button>
<button id="zatvoriIzbor" type="button" class="katalogModalButton katalogModalSecondary">Otkaži</button>
</div>
<div class="katalogModalBox" id="modalForma" style="display:none">
<h2>Podaci kupca</h2>
<div class="katalogFormaRed">
<div>
<label for="kupacIme">Ime</label>
<input id="kupacIme" type="text" autocomplete="given-name">
</div>
<div>
<label for="kupacPrezime">Prezime</label>
<input id="kupacPrezime" type="text" autocomplete="family-name">
</div>
</div>
<label for="kupacFirma">Naziv firme</label>
<input id="kupacFirma" type="text" autocomplete="organization">
<label for="kupacAdresa">Adresa</label>
<input id="kupacAdresa" type="text" autocomplete="street-address">
<label for="kupacEmail">Email adresa</label>
<input id="kupacEmail" type="email" autocomplete="email">
<div class="katalogEmailInfo">
email poslati na 
<a href="#" id="emailSlanjeLink">pedjapk74@gmail.com</a>
</div>
<button id="potvrdiXlsx" type="button" class="katalogModalButton katalogModalPrimary">Snimi Excel dokument (.xlsx)</button>
<button id="nazadIzbor" type="button" class="katalogModalButton katalogModalSecondary">Nazad</button>
<button id="zatvoriFormu" type="button" class="katalogModalButton katalogModalClose">Otkaži</button>
</div>
</div>
<div id="sadrzaj"></div>
<div id="navigacija">
<button id="prethodna" type="button">← Prethodna</button>
<button id="sledeca" type="button">Sledeća →</button>
</div>
</div>

function base64UTekst(base64){
const binary=atob(base64);
const bytes=new Uint8Array(binary.length);
for(let i=0;i<binary.length;i++){bytes[i]=binary.charCodeAt(i);}
return new TextDecoder().decode(bytes);
}

function otvoriModal(element){
modalIzbor.style.display='none';
modalForma.style.display='none';
element.style.display='block';
modalOverlay.classList.add('prikazi');
}
function zatvoriModal(){
modalOverlay.classList.remove('prikazi');
}
snimi.addEventListener('click',function(){
otvoriModal(modalIzbor);
});
izborXlsx.addEventListener('click',function(){
otvoriModal(modalForma);
try{kupacIme.focus();}catch(e){}
});
zatvoriIzbor.addEventListener('click',zatvoriModal);
zatvoriFormu.addEventListener('click',zatvoriModal);
nazadIzbor.addEventListener('click',function(){
otvoriModal(modalIzbor);
});
modalOverlay.addEventListener('click',function(event){
if(event.target===modalOverlay){
zatvoriModal();
}
});
document.addEventListener('keydown',function(event){
if(event.key==='Escape'){
zatvoriModal();
}
});
function procitajKupca(){
return {
ime:kupacIme.value.trim(),
prezime:kupacPrezime.value.trim(),
firma:kupacFirma.value.trim(),
adresa:kupacAdresa.value.trim(),
email:kupacEmail.value.trim()
};
}
function validirajKupca(kupac){
if(!kupac.ime||!kupac.prezime||!kupac.firma||!kupac.adresa||!kupac.email){
alert('Molimo unesite sva polja.');
return false;
}
if(!kupacEmail.checkValidity()){
alert('Unesite ispravnu email adresu.');
try{kupacEmail.focus();}catch(e){}
return false;
}
return true;
}
potvrdiXlsx.addEventListener('click',function(){
const kupac=procitajKupca();
if(!validirajKupca(kupac)){
return;
}
try{
potvrdiXlsx.disabled=true;
potvrdiXlsx.textContent='⏳ SNIMAM...';
napraviXLSX(kupac);
zatvoriModal();
}
catch(error){
console.error(error);
alert('Greška pri pravljenju Excel fajla:\n\n'+error.message);
}
finally{
potvrdiXlsx.disabled=false;
potvrdiXlsx.textContent='Snimi Excel dokument (.xlsx)';
}
});
